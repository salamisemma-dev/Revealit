name: Webpage

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Python contract tests
        run: python -m unittest discover -s tests -v

      - name: Run Node tests
        run: node --test tests/message.test.mjs

      - name: Run lint
        run: pnpm run lint

      - name: Prepare CI hosting manifest
        shell: bash
        run: |
          mkdir -p .openai
          printf '{"d1":null,"r2":null}\n' > .openai/hosting.json

      - name: Build Vinext app
        run: pnpm run build

      - name: Prepare standalone Pages site
        shell: bash
        run: |
          mkdir -p pages-dist
          cp index.html pages-dist/index.html
          cp -R public pages-dist/public

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
